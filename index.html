<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Counter App</title>

    <link rel="stylesheet" href="bootstrap.min.css" />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div
      class="container min-vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="counter-card text-center shadow-lg">
        <h1 class="fw-bold mb-2">Counter</h1>

        <p class="text-secondary mb-4">Increment and decrement the number</p>

        <div
          class="number-box d-flex justify-content-center align-items-center mx-auto mb-4"
        >
          <h2 id="result" class="m-0">0</h2>
        </div>

        <div class="d-flex justify-content-center gap-3">
          <button
            id="minusBtn"
            class="btn btn-outline-dark rounded-circle counter-btn"
            onclick="decrement()"
          >
            −
          </button>

          <button
            id="plusBtn"
            class="btn btn-primary rounded-circle counter-btn shadow-sm"
            onclick="increment()"
          >
            +
          </button>
        </div>
      </div>
    </div>

    <script src="bootstrap.bundle.min.js"></script>

    <script src="index.js"></script>
  </body>
</html>
